# hanlint의 GitHub Action. PR과 push에서 마크다운을 검사하고 지적이 난 줄에 주석을 단다.
# 이 저장소의 ci.yml이 이 액션으로 자기 문서를 실제로 검사한다(uses: ./).
name: hanlint
description: 한국어 마크다운에서 되풀이되는 결함을 찾아 그 줄에 주석을 단다
branding:
  icon: check-circle
  color: red

inputs:
  files:
    description: 검사할 마크다운 파일. 여러 개면 공백으로 나눈다
    required: true
  errors-only:
    description: 오류 지적만 표시한다 ("true" 또는 "false")
    required: false
    default: "false"
  command:
    description: hanlint 실행 명령. 기본은 npx로 npm 패키지를 받는다. 이 저장소 안에서는 node npm/bin/hanlint.js를 준다
    required: false
    default: npx --yes hanlint

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eu
        extra=""
        if [ "${{ inputs.errors-only }}" = "true" ]; then extra="--errors-only"; fi
        ${{ inputs.command }} ${{ inputs.files }} --format github $extra
