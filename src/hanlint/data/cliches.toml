# 상투어 사전. pattern은 정규식이다. 여기 있는 표현이 없어도 목적어가 흐린 문장은 나쁘다.
# 개수를 세어 점수를 내지 않는다. 걸린 곳만 짚는다. 사용자는 설정의 dictionary.cliches로 더한다.
# source가 빈 항목은 사용자가 찾아볼 수 없는 내부 자료에서 왔다. 그 자료 이름은 항목 위 주석에 둔다.

