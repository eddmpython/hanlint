# 아래 둘은 실제 글을 재서 넣었다. 사람 글 4,021편(위키백과 본문과 지침과 토론, 사업보고서)과 기계 글 360편을
# 비교해, 그 꼴이 한 번이라도 든 글의 비율이 사람 쪽에서 드문 것만 하나씩 짚는다. 흔한 것은 하나씩 짚으면
# 바르게 쓴 문장까지 잡히므로 phraseRepeat이 글 안의 비율로 본다. 잰 것은 tests/_attempts/aiTells다
# (probeDensity, 2026-09-20).

[[entry]]
pattern = "이유[가는]? 여기"
why = "이유를 말해 놓고 그 이유를 다시 가리키는 말이다. 이유를 말했으면 거기서 끝낸다"
source = "사람 글 0.10%, 기계 글 7.50%가 쓴다. 75배"

[[entry]]
# 문장 첫머리만 잡는다. 문장 가운데의 `그다음`은 바른 순서 표시다(`남미가 10번, 그다음 유럽이 6번`).
# 고칠 문제는 문장을 이 말로 시작해 산문에 번호를 매기는 것이다. 실제 글을 읽고 좁혔다.
pattern = "^그다음"
why = "산문에 번호를 매기는 말이다. 진짜 목록이면 목록으로 쓰고, 산문이면 앞 문장에 나온 이름을 다시 써서 잇는다"
source = "사람 글 0.47%, 기계 글 6.11%가 쓴다. 13배"

# 뺀 것도 적어 둔다. `~인 셈이다`는 사람 글 1.12%, 기계 글 6.94%로 6배였으나 사람 쪽에서 걸린 문장이
# 모두 바른 문장이었다(10년 걸린 셈입니다, 직원이 된 셈이다, 우민화 정책에 이용되었던 셈이다). 추론을 요약하는
# 바른 표현과 기계가 되짚는 말을 글자 모양으로 가르지 못한다. 글쓰기 지침에는 남기고 기계 검사에서 뺐다(2026-09-20).
