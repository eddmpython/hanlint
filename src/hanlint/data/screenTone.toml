# 접객 말투 사전. 안심시키는 말, 사용자를 초대하는 말, 손님 대하듯 높이는 말.
# 문장이 허용된 자리에서도 사족이라 산문 프리셋의 enforceStyle 로 켤 수 있다. pattern 은 정규식이다.
# 사용자는 설정의 dictionary.screenTone 으로 더한다. 실측은 Taxly 화면 낱말 규약 (2026-09-17) 의 실제 화면 문구다.

[[entry]]
pattern = "(?:언제든|안심하|안심해|안심시|걱정 없이|걱정하지|편하게|간편하게|자유롭게|바로 살펴|그대로 두셔도)"
why = "는 안심시키는 말이다. 정보가 아니므로 지운다"
source = "화면 낱말 규약"

[[entry]]
pattern = "(?:살펴보세요|살펴보십시오|살펴봐요|해 보세요|해 보십시오|해 봐요|확인해 보세요|시작해 보세요|이어가세요)"
why = "는 사용자를 초대하는 말이다. 다음 동작은 단추다"
source = "화면 낱말 규약"

[[entry]]
pattern = "(?:하시면|하셔도|하실|하신|해 주시면|주시고|드립니다|드리겠습니다|드린다|드려요|보여드립니다|보여 드립니다|부르겠습니다|부르겠다|부를게요)"
why = "는 접객 말투다. 화면의 글은 낱말이므로 지운다"
source = "화면 낱말 규약"
