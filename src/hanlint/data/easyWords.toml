# 문맥 없이 바꿔도 뜻을 지키는 행정 한자어. 제안이라 hardWord 규칙이 notice로 내고 hanlint fix는 적용하지 않는다.
# 출처: 국립국어원 다듬은 말(https://www.korean.go.kr/front/imprv/refineList.do, 공공누리 제1유형 출처 표시)과
# 표준국어대사전(https://stdict.korean.go.kr)의 동의어 정보. 출처에 대체어가 있어도 모든 문맥에서 뜻이 같지는
# 않으므로 기술 용어와 뜻이 다른 외래어는 기본 사전에 넣지 않는다. 일본어투(구좌, 익일, 잔고, 고참,
# 망년회)는 japaneseLoan에 있어 여기 없다.
# {조사}는 단어 뒤에 조사가 붙었거나 단어가 끝나는 곳이라 금일봉, 하기 위해, 당해 봤다 같은 다른 단어는 잡지 않는다.
# 사용자는 설정의 dictionary.easyWords로 더한다.

[[entry]]
pattern = '(?<![가-힣])금일{조사}'
fix = "오늘"
why = "`오늘`로 바꿔 쓸 수 있다"
source = "표준국어대사전 표제어 `금일`"

[[entry]]
pattern = '(?<![가-힣])익월{조사}'
fix = "다음 달"
why = "`다음 달`로 바꿔 쓸 수 있다"
source = "국립국어원 다듬은 말"

