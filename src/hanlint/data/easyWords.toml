# 쉬운 말이 있는 어려운 한자어와 외래어. 제안이라 hardWord 규칙이 notice 로 내고 hanlint fix 는 적용하지 않는다.
# 출처: 국립국어원 다듬은 말 (https://www.korean.go.kr/front/imprv/refineList.do, 공공누리 제1유형 출처 표시) 과
# 표준국어대사전 (https://stdict.korean.go.kr) 의 동의어 정보. 2026-08-27 에 표본 (금일=오늘, 명일=내일, 매뉴얼=설명서,
# 역활→역할, 바램→바람) 을 사전에서 확인했다. 일본어투 (구좌, 익일, 잔고, 고참, 망년회) 는 japaneseLoan 에 있어 여기 없다.
# {조사} 는 낱말 뒤에 조사가 붙었거나 낱말이 끝나는 자리라 금일봉, 하기 위해, 당해 봤다 같은 다른 낱말은 잡지 않는다.
# 사용자는 설정의 dictionary.easyWords 로 더한다.

