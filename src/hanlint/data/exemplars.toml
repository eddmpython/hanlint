# 규칙마다 고치기 전과 후의 본보기. 지적은 무엇이 틀렸는지 말하고 본보기는 무엇이 맞는지 보인다.
#
# 왜 필요한가. 실측 (tests/_attempts/fixReach) 에서 발행본 다섯 편의 지적 104건 가운데 기계가 고쳐 주는
# 것이 0건이었다. 100%가 이유만 받고 어떻게 쓰는지는 글쓴이 몫으로 남았다. 사람은 금지 목록보다 본보기를
# 글쓴이와 AI 가 규칙 이름과 이유뿐 아니라 검증된 변환 한 쌍을 함께 보게 한다. 실제 수정 차이는 별도 탐침에서 잰다.
#
# 규칙 하나에 본보기 하나가 계약이다 (tests/gates/testExemplars.py 가 강제한다).
# before 는 실제로 그 규칙에 잡히는 글이어야 하고 after 는 잡히지 않아야 한다. 게이트가 둘 다 확인한다.
# moved 는 무엇이 달라졌는지 한 마디다. 규칙 이름을 되풀이하지 않고 손이 한 일을 적는다.
#
# 자리표시자 둘이 있다. fixture 와 같은 규약이다. `{em}` 은 긴 줄표, `{dot}` 은 마침표이고 읽을 때 제
# 글자가 된다. 그 둘을 글자 그대로 두면 이 저장소의 쓰기 훅이 파일을 막는다. 결함을 보여야 하는 자리라
# 결함을 파일에 담을 수 없는 것이 이 규약의 까닭이다.

[[entry]]
rule = "blockUnread"
before = "```python\nprint(count)\n```\n\n```text\n5247597\n```\n\n## 다음 절\n\n마무리입니다.\n"
after = "```python\nprint(count)\n```\n\n```text\n5247597\n```\n\n답은 5백만 줄이 조금 넘습니다. 이 숫자가 나오면 파일을 다 읽은 것입니다.\n"
moved = "출력 바로 아래에 그 숫자를 읽어 주는 문장을 붙였다"

