before = "## 절\n\n파일을 엽니다.\n\n## 다음 절\n\n표가 생깁니다.\n"
after = "## 절\n\n파일을 엽니다.\n\n## 다음 절\n\n그럼 표는 어디에 생겼을까요? 실행한 폴더에 있습니다.\n"
moved = "독자가 품을 의문을 대신 묻고 다음 문장에서 답했다"

[[entry]]
rule = "nounPile"
before = "가상환경 생성 후 패키지 설치 확인 절차를 따릅니다."
after = "가상환경을 만든 뒤 패키지가 깔렸는지 확인합니다."
moved = "쌓인 명사를 동사로 되돌려 무엇이 무엇의 목적어인지 드러냈다"

[[entry]]
rule = "nounPile"
presets = ["report"]
before = "지역 경제 활성화 지원 사업 추진 계획을 발표했습니다."
after = "지역 경제를 활성화하려고 지원 사업을 추진한다는 계획을 발표했습니다."
moved = "보고서의 사업 이름은 남기고 관계를 동사로 풀었다"

[[entry]]
rule = "nounPile"
presets = ["docs", "encyclopedia"]
before = "사용자 인증 토큰 갱신 실패 처리 절차를 설명합니다."
after = "사용자 인증 토큰을 갱신하지 못했을 때 어떻게 처리하는지 설명합니다."
moved = "기술 용어는 남기고 실패 조건과 처리 행동을 풀어 썼다"

[[entry]]
rule = "numberOrphan"
before = "메모리 최대치는 453MB에서 700MB로 올라갔습니다."
after = "표를 통째로 올린 직후가 453MB였고 넘기고 나자 700MB가 됐습니다."
moved = "기준값이 어디서 나온 값인지 그 자리에서 밝혔다"

[[entry]]
rule = "outsideProfile"
before = "파일을 열고 표를 확인한 다음 열 다섯 개의 이름을 하나씩 읽어 두고 값을 고친 뒤 저장하고 폴더를 만들고 파일을 옮기고 이름을 바꾸고 목록을 다시 보고 끝낸 다음 다시 처음부터 열어 표가 보이면 열의 순서를 적어 두고 값을 고친 뒤 저장하고 닫고 다시 열어 확인하고 이름을 바꾼 파일을 목록에서 찾아 열고 표를 확인하고 값을 고치고 저장한 다음 폴더를 정리하고 파일을 옮기고 목록을 다시 보고 끝냅니다."
after = "파일을 열고 표를 확인합니다. 열 다섯 개의 이름을 읽어 두고 값을 고친 뒤 저장합니다. 폴더를 만들고 파일을 옮긴 뒤 이름을 바꿉니다. 목록을 다시 보고 끝냅니다."
moved = "같은 종류 글의 99% 가 들어오는 길이 안으로 문장을 넷으로 나눴다"

[[entry]]
rule = "paraFragment"
before = "표를 엽니다.\n\n값을 넣습니다.\n\n화면을 봅니다.\n"
after = "표를 열어 값을 넣으면 화면에 다섯 열이 보입니다. 열 이름이 첫 줄에 그대로 있으면 제대로 읽은 것입니다.\n"
moved = "줄바꿈을 화제가 바뀌는 자리에만 두고 조각을 한 문단으로 묶었다"

[[entry]]
rule = "platformApi"
before = "```python\nprint(process.memory_info().peak_wset)\n```\n"
after = "```python\nimport tracemalloc\ntracemalloc.start()\nprint(tracemalloc.get_traced_memory()[1])\n```\n"
moved = "한 운영체제에서만 도는 API 를 표준 라이브러리의 어디서나 도는 것으로 바꿨다"

[[entry]]
rule = "promiseRecall"
before = "자세한 것은 뒤에서 다루겠습니다.\n\n## 절\n\n다른 이야기로 끝납니다.\n"
after = "자세한 것은 뒤에서 다루겠습니다.\n\n## 절\n\n앞에서 미룬 usecols 를 이제 봅니다.\n"
moved = "미룬 것을 앞에서 쓴 이름으로 다시 불러 회수했다"

[[entry]]
rule = "redundantPair"
before = "그때 당시에는 매 시간마다 확인했습니다."
after = "그때는 한 시간마다 확인했습니다."
moved = "같은 뜻이 두 번 든 겹말을 하나로 줄였다"

