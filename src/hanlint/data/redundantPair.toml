# 겹말 사전. 뜻이 겹치는 두 표현을 함께 쓴 것. 출처는 국립국어원 새국어생활 2005 한규희, 법조신문.

[[entry]]
pattern = "역전 ?앞"
fix = "역 앞"
why = "역전 (驛前) 이 이미 역 앞이다"
source = "국립국어원 2005"

[[entry]]
pattern = "그때 당시"
fix = "그때"
why = "그때와 당시가 같은 뜻이다"
source = "국립국어원 2005"

[[entry]]
pattern = "매 ?시간마다"
fix = "매시간"
why = "매와 마다가 같은 뜻이다"
source = "국립국어원 2005"

[[entry]]
pattern = "해변가"
fix = "해변"
why = "해변 (海邊) 의 변이 이미 가다"
source = "국립국어원 2005"

[[entry]]
pattern = "판이하게 다(?=[르른릅])"
fix = "판이하"
why = "판이하다가 이미 아주 다르다는 뜻이다"
source = "법조신문 넘쳐나는 겹말들"

[[entry]]
pattern = "결실을 맺"
fix = "결실을 보"
why = "결실 (結實) 의 결이 이미 맺다다"
source = "법조신문 넘쳐나는 겹말들"

[[entry]]
pattern = "남은 여생"
fix = "여생"
why = "여생 (餘生) 이 이미 남은 삶이다"
source = "법조신문 넘쳐나는 겹말들"

[[entry]]
pattern = "미리 예약"
fix = "예약"
why = "예약 (豫約) 의 예가 이미 미리다"
source = "법조신문 넘쳐나는 겹말들"

# 再 는 아무 한자어에나 붙는 생산적 접두사라 낱말을 다 셀 수 없다. 그래서 드는 목록이 아니라 빼는 목록이다.
# 재 가 財 (재력), 才 (재주), 材 (재료), 災 (재난), 在 (재고), 裁 (재판) 인 흔한 낱말을 뺀다.
# {조사} 가 낱말 끝을 재므로 두 뜻이 갈린다. 재정 을 뺐어도 재정의한다 (再定義) 는 의 뒤가 한글이라
# 조사로 끝나지 않아 그대로 잡고, 다시 재정의 문제 (財政) 는 조사로 끝나 뺀다. 재해석, 재산정, 재주문도 같다.
# 재임 은 再任 이 실측에 있어 빼지 않는다. 실측: 말뭉치 1,600편에 다시 재X 가 14건이고 그 가운데
# 재력 (財力) 과 재주 (才) 둘만 겹말이 아니다. 드는 목록이던 때는 재탈환, 재임, 재편, 재활, 재도입,
# 재구매, 재수 를 놓쳤다. 또다시 를 함께 먹지 않으면 고침이 또재임을 처럼 깨진다 (2026-08-31).
[[entry]]
pattern = "(?:또)?다시 재(?!(?:력|주|산|물|화|벌|원|무|정|능|치|간|료|목|질|난|해|앙|고|판){조사})([가-힣]+)"
fix = "재$1"
why = "재 (再) 가 이미 다시다"
source = "법조신문 넘쳐나는 겹말들"

[[entry]]
pattern = "서로 상의"
fix = "상의"
why = "상의 (相議) 의 상이 이미 서로다"
source = "법조신문 넘쳐나는 겹말들"

[[entry]]
pattern = "과반수 이상"
fix = "과반수"
why = "과반수가 이미 절반 이상이다"
source = "법조신문 넘쳐나는 겹말들"
