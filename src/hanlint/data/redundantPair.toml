# 겹말 사전. 뜻이 겹치는 두 표현을 함께 쓴 것. 출처는 국립국어원 새국어생활 2005 한규희, 법조신문.

[[entry]]
pattern = "역전 ?앞"
fix = "역 앞"
why = "역전 (驛前) 이 이미 역 앞이다"
source = "국립국어원 2005"

[[entry]]
pattern = "그때 당시"
fix = "그때"
why = "그때와 당시가 같은 뜻이다"
source = "국립국어원 2005"

[[entry]]
pattern = "매 ?시간마다"
fix = "매시간"
why = "매와 마다가 같은 뜻이다"
