# 글 하나가 기대는 문형 수법. 낱낱은 정당한 용법이라 밀도로만 짚는다.
#
# share 는 그 꼴이 든 산문 문장의 비율 임계다. 항목마다 따로 재서 넣는다. 사람 글 4,021편 (위키백과 본문,
# 위키백과 지침, 위키백과 토론, 사업보고서) 과 기계 글 360편의 문서별 분포에서, **사람 99분위 위**를 고른다.
# 임계를 여기 두는 것은 그 수가 그 꼴의 성질이기 때문이다. 꼴마다 사람이 쓰는 정도가 다르다.
# 잰 것은 tests/_attempts/aiTells/probeDensity.py 다. 종결은 세 문체를 다 받는다. 한다체만 받다가 본보기
# 게이트가 해요체에서 못 잡는 것을 드러냈다 (먼저예요). 문체를 가르는 규칙이 아니다.
#
# 되풀이는 2회부터다 (규칙의 MIN_HITS). 비율만 보면 아홉 문장짜리 글의 한 번이 11% 라 임계를 넘는데 한 번은
# 버릇이 아니다. 이 조건 없이 만들었다가 규칙이 한 번 나온 자리를 짚는 것을 보고 고쳤다.
#
# 여기 없는 것도 적어 둔다. 둘 다 작법서 (skills/write-korean/koreanProse.md) 에는 남기고 기계 검사에서만 뺐다.
# `첫 번째는 / 두 번째는` 은 사람 글 2.06%, 기계 5.00% 로 배수가 2배뿐이라 규칙이 못 된다.
# `~하는 편이 낫다` 는 낱낱으로 짚으면 사람 글 3.31% 를 때리고, 2회 조건을 걸면 기계 글의 1% 만 걸려
# 어느 쪽으로도 규칙이 못 된다. 기계 글이 9~20문장이라 같은 꼴을 두 번 쓰는 일이 드물어서다.

[[entry]]
pattern = "[이가] 아니라[^.!?]{0,40}(?:이다|입니다|이에요|예요|이야|다\\.|요\\.)"
share = 0.08
label = "X가 아니라 Y다"
why = "안 물어본 오해를 세워 놓고 바로잡는 수법이다. 한 편에 한 번이면 힘이 있고 되풀이하면 버릇이다. Y다 라고 바로 쓴다"
source = "사람 4,021편의 99분위 7.1%, 기계 360편의 33%가 8% 위 (probeDensity 2026-09-20)"
