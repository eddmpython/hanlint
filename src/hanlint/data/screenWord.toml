# 화면의 단어 사전. 개발자의 말이 화면에 새어 나온 것과, 프로젝트가 한 이름으로 정한 단어의 다른 이름.
# 기본 항목은 설명이 필요한지 문맥을 검토할 기술 용어다. 프로젝트가 정한 단어(회사 → 수임처, 회계사 → 세무사)는 설정의
# dictionary.screenWord로 더한다. 같은 곳에 기본 항목과 설정 항목이 함께 걸리면 설정 항목이 이긴다.
# 기본 항목은 notice이며 fix를 두지 않는다. 프로젝트가 명시한 용어 규약만 error와 fix를 낸다.
# 프로젝트 항목은 사용자가 실제로 쓰는 말을 고정하는 것이다. 표준 외래어(데이터, 캐시, 스냅샷, 다운로드)를 순우리말로 바꾸지 않는다.
# fix는 사람들이 이미 쓰는 말만 둔다. 글자대로 옮겨 새로 지은 말(저장본, 넘침, 그리기)이나 한 프로젝트에서 온 대체어는 fix로 두지 않는다(2026-09-29).
# {조사}는 단어 뒤에 조사가 붙었거나 단어가 끝나는 곳이라 온라인, 파이프라인 같은 다른 단어는 잡지 않는다.
# 지적의 글은 `{찾은 말}`은/는 {why}다. 틀이 찾은 말 뒤에 받침에 맞는 은/는을 붙이므로 why는 조사 없이 시작한다.
# Taxly 화면 낱말 규약(2026-09-17)의 화면 글 4,177개에서 개발 어휘로 지적된 77건을 보고 넣었다.
# 출처는 사용자가 찾아볼 수 없는 내부 문서와 개발 용어 목록이라 source를 비운다.

