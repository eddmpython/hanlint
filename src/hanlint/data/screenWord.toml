# 화면의 낱말 사전. 개발자의 말이 화면에 새어 나온 것과, 프로젝트가 한 이름으로 정한 낱말의 다른 이름.
# 기본 항목은 어느 제품에서나 개발 어휘인 말이다. 프로젝트의 정본 낱말 (데이터 → 자료, 회사 → 수임처) 은 설정의
# dictionary.screenWord 로 더한다. 같은 자리에 기본 항목과 설정 항목이 함께 걸리면 설정 항목이 이긴다.
# fix 가 있는 항목은 어느 문맥에서나 그 말이 맞는 것이고, 없는 항목은 자리마다 사용자의 낱말을 골라야 하는 것이다.
# {조사} 는 낱말 뒤에 조사가 붙었거나 낱말이 끝나는 자리라 온라인, 파이프라인 같은 다른 낱말은 잡지 않는다.
# why 는 지적에서 낱말 바로 뒤에 붙으므로 받침에 맞는 조사 (은/는) 로 시작한다.
# 실측은 Taxly 화면 낱말 규약 (2026-09-17) 의 화면 글 4,177개에서 개발 어휘로 지적된 77건이다.

[[entry]]
pattern = '(?<![가-힣a-zA-Z])메타데이터{조사}'
why = "는 개발 어휘다. 무엇의 정보인지 그 이름으로 쓴다 (계약 정보, 감사 기록)"
source = "Taxly 화면 낱말 규약"

