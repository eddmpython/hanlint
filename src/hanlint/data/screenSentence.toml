# 낱말 자리의 문장 사전. 화면의 글 (단추, 이름표, 상태, 빈 상태, 진행, 실패) 은 낱말이고 종결어미가 보이면 문장이다.
# pattern 은 정규식이다. 구체 무늬 (진행, 실패, 요구, 입력 요청, 완료) 가 앞에 있고 종결어미 전체가 마지막에 있다.
# 규칙 screenSentence 는 문장마다 가장 앞의 매치 하나만 짚으므로 구체 무늬의 why 가 종결어미의 why 보다 먼저 읽힌다.
# 사용자는 설정의 dictionary.screenSentence 로 더한다. 실측은 Taxly 화면 낱말 규약 (2026-09-17) 의 실제 화면 문구다.

[[entry]]
pattern = "(?:하고|보고|가고|오고|열고|만들고|찾고|기다리고|계산하고|확인하고|연결하고|정리하고|읽고|쓰고) (?:있습니다|있다|있어요)"
why = "는 진행을 문장으로 쓴 것이다. `<동작> 중` 한 낱말로 쓴다 (대시보드 여는 중, 시작 준비 확인 중)"
source = "화면 낱말 규약"

[[entry]]
pattern = "(?:하지|되지|찾지|열지|만들지|가지|오지|읽지|쓰지|받지) (?:못했습니다|않았습니다|못합니다|못했다|않았다|못한다|못했어요|않았어요|못해요)"
why = "는 실패를 문장으로 쓴 것이다. `<대상> <동작> 실패` 로 쓴다 (요청 실패, 자료 불러오기 실패)"
source = "화면 낱말 규약"

[[entry]]
pattern = "(?:필요합니다|필요하다|필요해요|해야 합니다|해야 한다|해야 해요|하셔야 합니다)"
why = "는 요구를 문장으로 쓴 것이다. `<대상> 필요` 로 쓴다 (로그인 필요, 사전 승인 IP 필요)"
source = "화면 낱말 규약"

[[entry]]
pattern = "(?:입력해 주세요|입력하세요|입력하십시오|선택해 주세요|선택하세요|체크해 주세요|눌러 주세요|누르세요)"
why = "는 칸의 이름표가 할 말이다. 이름표가 무엇을 넣는지 말하고 빠진 값은 `<대상> 필요` 로 쓴다"
source = "화면 낱말 규약"

[[entry]]
pattern = "(?:했습니다|됐습니다|되었습니다|끝났습니다|했다|됐다|되었다|끝났다|했어요|됐어요|되었어요|끝났어요)"
why = "는 끝난 일을 문장으로 쓴 것이다. 상태 한 낱말로 쓴다 (승인됨, 변경됨, 완료)"
source = "화면 낱말 규약"

[[entry]]
pattern = "(?:습니다|입니다|합니다|됩니다|세요|십시오|해요|돼요|예요|이에요|있어요|없어요)|(?:한다|된다|있다|없다|이다|아니다|았다|었다|였다|겠다|하다|되다|같다|다르다|않다|는다|온다|간다|본다|낸다|준다|든다)(?=\\s*[.!]?\\s*$)|[가-힣]다\\.|까\\?"
why = "는 종결어미다. 낱말 자리에 문장을 두지 않는다. 문장이 정말 필요한 글 (장표, 고지, 실패 원인) 은 문장이 허용된 글 모듈로 옮기고 chat 프리셋으로 잰다"
source = "화면 낱말 규약"
