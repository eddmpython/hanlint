# 문형. 빈칸이 있는 문장 틀이다. 본보기가 고친 사례 하나라면 문형은 그 사례를 다시 쓸 수 있는 틀이다.
#
# 왜 필요한가. 한국 글쓰기 책들이 공통으로 드는 조언 (이오덕 `우리글 바로쓰기`, 이수열 `우리말 우리글
# 바로 쓰기`, 김정선 `내 문장이 그렇게 이상한가요`, 배상복 `문장기술`) 을 규칙으로 넣으려고 실측했더니
# 대부분 규칙이 아니었다 (tests/_attempts/koreanStyleBooks). 김정선이 든 `것` 은 다섯 편에서 75건인데
# 표본이 전부 정당했다. 그 조언들은 "이건 틀렸다" 가 아니라 "이 자리를 다시 보라" 는 교정자의 눈이다.
# 금지로는 못 담고 틀로는 담긴다. 그래서 여기다.
#
# 필드
#   name   문형의 이름. 언제 쓰는지가 이름에 보여야 한다
#   form   빈칸이 있는 틀. 빈칸은 {중괄호} 다
#   when   이 틀을 꺼내는 자리
#   example  그 틀로 실제로 쓴 문장. hanlint 를 error 0 으로 통과해야 한다 (게이트가 확인한다)
#   instead  같은 자리에 흔히 쓰는 문장. avoids 의 규칙에 실제로 잡혀야 한다 (게이트가 확인한다)
#   avoids   이 틀이 피하는 규칙 이름들
#   source   어느 책이나 어느 규칙에서 왔는지
#
# 게이트 (tests/gates/testPatterns.py) 가 example 과 instead 를 매번 돌린다. 규칙이 바뀌어 틀이 낡으면
# 빨갛다. 통과가 보장된 틀이라는 것이 이 파일의 값이고 그것은 이 도구만 줄 수 있다.

[[entry]]
name = "행동과 결과"
form = "{대상}을 {행동}하면 {결과}가 {어디}에 {생깁니다}"
when = "독자에게 무엇을 시킬 때. 가능성만 말하지 않고 손이 할 일과 눈에 보일 것을 한 문장에 담는다"
example = "`저장` 버튼을 누르면 `report.csv` 가 그 폴더에 만들어집니다."
instead = "이 기능을 통해 파일 생성이 가능합니다."
avoids = ["translationese"]
source = "글쓰기 스킬의 쉬운 말로 바로 쓰기. 배상복 문장기술의 주어와 서술어를 붙여 쓰기"

[[entry]]
name = "확인"
form = "{무엇}이 {어떤지} 확인합니다. {그 값}이 보이면 된 것입니다"
when = "절을 닫을 때. 독자가 자기 화면에서 결과를 확인할 자리를 만든다"
example = "폴더에 `link.png` 가 생겼는지 확인합니다. 파일이 보이면 된 것입니다."
instead = "결과가 저장되어집니다."
avoids = ["doublePassive"]
source = "글쓰기 스킬의 한 절을 다 읽으면 결과 하나가 남는다"

[[entry]]
name = "인과 잇기"
form = "{앞 사실}입니다. 그래서 {뒤 사실}입니다"
when = "사실이 둘 이상 나란히 놓일 때. 관계를 독자가 세우게 두지 않는다"
example = "병합 셀은 첫 칸에만 값이 들어 있습니다. 그래서 그대로 정렬하면 빈 칸이 값과 떨어져 순서가 깨집니다."
instead = "값이 있습니다. 칸은 빕니다. 순서가 깨집니다."
avoids = ["factListParagraph"]
source = "글쓰기 스킬의 설명을 풀어 쓰기. 이수열의 문장은 이어져야 한다"

[[entry]]
name = "이름으로 이어받기"
form = "{앞에서 만든 것}은 {상태}입니다. {아직 못 하는 일}입니다"
when = "새 문단이나 새 절을 열 때. 지시어 대신 앞에서 만든 것의 이름을 부른다"
example = "`link.png` 는 33픽셀입니다. 명함에 넣기에는 너무 작습니다."
instead = "터미널을 엽니다. 이것을 실행합니다."
avoids = ["danglingDeixis"]
source = "글쓰기 스킬의 절은 앞 절이 못 한 일에서 시작한다. 김정선의 것을 이름으로"

[[entry]]
name = "독자에게 묻기"
form = "그럼 {무엇}은 {어디}에 {있을까요}? {답}"
when = "독자가 품을 의문이 생기는 자리. 대신 묻고 다음 문장에서 답한다"
example = "## 절\n\n파일을 만듭니다.\n\n## 다음 절\n\n그럼 파일은 어디에 생겼을까요? 방금 명령을 실행한 그 폴더에 있습니다.\n"
instead = "## 절\n\n파일을 만듭니다.\n\n## 다음 절\n\n파일이 만들어집니다.\n"
avoids = ["noQuestion"]
source = "글쓰기 스킬의 사실과 목소리"

[[entry]]
name = "값 소개"
form = "{값}은 {무엇}입니다. {왜 그 값인지}. {지금 무엇을 하면 되는지}"
when = "새 숫자나 옵션이 처음 나올 때. 셋 중 하나라도 못 적으면 그 값을 아직 넣을 때가 아니다"
example = "`border` 는 그림 바깥에 남기는 빈 칸의 수입니다. 빈 자리가 없으면 카메라가 그림의 끝을 못 찾습니다. 그래서 기본값 4 를 그대로 둡니다."
instead = "메모리 최대치는 453MB에서 700MB로 올라갔습니다."
avoids = ["numberOrphan"]
source = "글쓰기 스킬의 새로 나온 값과 옵션은 세 가지를 그 자리에서 준다"

[[entry]]
name = "동사로 되돌리기"
form = "{무엇}을 {한 뒤} {무엇}이 {어떤지} {확인합니다}"
when = "명사가 셋 이상 이어질 때. 조사를 되살려 무엇이 무엇의 목적어인지 보인다"
example = "가상환경을 만든 뒤 패키지가 깔렸는지 확인합니다."
instead = "가상환경 생성 후 패키지 설치 확인 절차를 따릅니다."
avoids = ["nounPile"]
source = "이오덕 우리글 바로쓰기의 명사문을 동사문으로. 글쓰기 스킬의 명사를 쌓지 말고 동사로 되돌린다"

[[entry]]
name = "결핍 도입"
form = "{독자가 지금 하려는 일}입니다. {왜 지금 방법으로는 안 되는지}. 끝까지 읽으면 {손에 남는 것}이 남습니다"
when = "글의 첫 문단. 정의로 시작하지 않고 독자가 막힌 자리로 시작한다"
example = "거래 기록을 CSV로 내려받았더니 5백만 줄입니다. 엑셀로 열면 1,048,576줄에서 잘립니다. 끝까지 읽으면 그 표를 여는 코드가 손에 남습니다."
instead = "핵심은 속도입니다."
avoids = ["cliche"]
source = "글쓰기 스킬의 도입은 결핍부터. 이태준 문장강화의 첫머리"

[[entry]]
name = "미룬 것 회수"
form = "앞에서 미룬 {이름}을 이제 봅니다"
when = "뒤에서 다루겠다고 해 둔 것을 실제로 다루는 자리. 미뤘다는 사실을 밝히고 그 이름을 다시 부른다"
example = "앞에서 미룬 `usecols` 를 이제 봅니다."
instead = "다음으로 크기를 바꿉니다."
avoids = ["fillerOpener"]
source = "글쓰기 스킬의 미룬 것은 같은 글 안에서 회수한다"
