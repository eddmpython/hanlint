# 자주 틀리는 띄어쓰기. 틀렸다고 확정할 수 있는 것만 둔다. 뿐, 만큼, 대로는 체언 뒤(조사, 붙여 씀)와 관형형 뒤
# (의존 명사, 띄어 씀)를 글자 모양만으로 가르지 못해 넣지 않는다. 못하다/못 하다, 안되다/안 되다도 뜻에 따라 둘 다 맞아 넣지 않는다.
# pattern은 정규식이다. {ㄹ}과 {ㄴ}은 그 받침으로 끝나는 음절 전체의 문자 부류로 펼쳐진다. fix의 $1은 그룹이다.
# 근거는 국립국어원 한글 맞춤법 제5장 띄어쓰기(제41항 조사, 제42항 의존 명사, 제43항 단위 명사)다. 2026-08-27 확인.

[[entry]]
pattern = '(?![실술])({ㄹ})수 ?(있|없)'
fix = "$1 수 $2"
why = "의존 명사 `수`를 앞말과 띄어 `할 수 있다`로 쓴다"
source = "한글 맞춤법 제42항"

[[entry]]
pattern = '(?![실술])({ㄹ})수밖에'
fix = "$1 수밖에"
why = "의존 명사 `수`는 띄어 쓰고 조사 `밖에`는 붙여 써서 `할 수밖에`로 쓴다"
source = "한글 맞춤법 제41항, 제42항"

[[entry]]
pattern = '수 밖에(?![가-힣])'
fix = "수밖에"
why = "조사 `밖에`를 앞말에 붙여 `수밖에`로 쓴다"
source = "한글 맞춤법 제41항"

[[entry]]
pattern = '(것|거)같(?=[다아은을지네습])'
fix = "$1 같"
why = "`것`과 `같다`가 다른 단어라 `것 같다`로 띄어 쓴다"
source = "한글 맞춤법 제42항"

[[entry]]
pattern = '뿐만아니라'
fix = "뿐만 아니라"
why = "`아니라`가 용언이라 앞말과 띄어 `뿐만 아니라`로 쓴다"
source = "한글 맞춤법 제2항, 문장의 각 단어는 띄어 쓴다"

[[entry]]
pattern = '그럼에도불구하고'
fix = "그럼에도 불구하고"
why = "`불구하고`가 용언이라 앞말과 띄어 `그럼에도 불구하고`로 쓴다"
source = "한글 맞춤법 제2항"

[[entry]]
pattern = '한번도(?![가-힣])'
fix = "한 번도"
why = "횟수를 세는 단위 명사 `번`을 띄어 `한 번도`로 쓴다. `한번`은 시도나 강조일 때만 붙여 쓴다"
source = "한글 맞춤법 제43항"

[[entry]]
pattern = '(두|세|네|다섯|여섯|일곱|여덟|아홉|열)번(?![가-힣])'
fix = "$1 번"
why = "횟수를 세는 단위 명사 `번`을 띄어 쓴다"
source = "한글 맞춤법 제43항"

[[entry]]
pattern = '({ㄹ})줄 (?=알|모르|아는|모르는|압|몰)'
fix = "$1 줄 "
why = "방법이나 셈을 뜻하는 의존 명사 `줄`을 띄어 `할 줄 안다`로 쓴다"
source = "한글 맞춤법 제42항"

# 물때(밀물과 썰물의 때, 물때표)와 밀물때, 썰물때, 물때썰때는 한 단어라 뺀다. `물 때`(무는 때)와 글자가
# 같아 구별할 수 없으므로 둘 다 짚지 않는다. 돈값의 `물때는 사리 전후가 좋습니다.`를 `물 때는`으로 고치라고
# 했다(2026-11-01). 기준 말뭉치 1,600편에서 이 항목이 맞은 단어 92가지 가운데 한 단어는 소설의 `물때 낀 돌멩이`
# 하나였고 나머지는 모두 띄어 쓸 곳이었다.
[[entry]]
pattern = '(?<!물때)((?!물){ㄹ})때(?=[가는도마다에의]?(?![가-힣]))'
fix = "$1 때"
why = "명사 `때`를 관형형 뒤에서 띄어 `할 때`로 쓴다"
source = "한글 맞춤법 제2항"
