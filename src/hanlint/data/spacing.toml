# 자주 틀리는 띄어쓰기. 확정할 수 있는 자리만 둔다. 뿐, 만큼, 대로 는 체언 뒤 (조사, 붙여 씀) 와 관형형 뒤
# (의존 명사, 띄어 씀) 를 표층으로 가르지 못해 넣지 않는다. 못하다/못 하다, 안되다/안 되다 도 뜻이 갈려 넣지 않는다.
# pattern 은 정규식이다. {ㄹ} 과 {ㄴ} 은 그 받침으로 끝나는 음절 전체의 문자 부류로 펼쳐진다. fix 의 $1 은 그룹이다.
# 근거는 국립국어원 한글 맞춤법 제5장 띄어쓰기 (제41항 조사, 제42항 의존 명사, 제43항 단위 명사) 다. 2026-08-27 확인.

[[entry]]
pattern = '(?![실술])({ㄹ})수 ?(있|없)'
fix = "$1 수 $2"
why = "수 는 의존 명사라 앞말과 띄어 쓴다. 할 수 있다"
source = "한글 맞춤법 제42항"

[[entry]]
pattern = '(?![실술])({ㄹ})수밖에'
fix = "$1 수밖에"
why = "수 는 의존 명사라 띄어 쓰고 조사 밖에 는 붙여 쓴다. 할 수밖에"
source = "한글 맞춤법 제41항, 제42항"

[[entry]]
pattern = '수 밖에(?![가-힣])'
fix = "수밖에"
why = "밖에 는 조사라 앞말에 붙여 쓴다"
source = "한글 맞춤법 제41항"

[[entry]]
pattern = '(것|거)같(?=[다아은을지네습])'
fix = "$1 같"
why = "것 과 같다 는 다른 낱말이라 띄어 쓴다. 것 같다"
source = "한글 맞춤법 제42항"

[[entry]]
pattern = '뿐만아니라'
fix = "뿐만 아니라"
why = "아니라 는 용언이라 앞말과 띄어 쓴다"
source = "한글 맞춤법 제2항 (문장의 각 단어는 띄어 쓴다)"

[[entry]]
pattern = '그럼에도불구하고'
fix = "그럼에도 불구하고"
why = "불구하고 는 용언이라 앞말과 띄어 쓴다"
source = "한글 맞춤법 제2항"

[[entry]]
pattern = '(?![인는])({ㄴ})지 (?=\d|한|두|세|네|몇|오래|얼마|며칠|하루|이틀|사흘|일주일|한참|십|이십|백|반년|일 년|한 달)'
fix = "$1 지 "
why = "지난 시간을 뜻하는 지 는 의존 명사라 띄어 쓴다. 떠난 지 3년"
source = "한글 맞춤법 제42항"

[[entry]]
pattern = '한번도(?![가-힣])'
fix = "한 번도"
why = "횟수를 세는 번 은 단위 명사라 띄어 쓴다. 한번 은 시도나 강조일 때만 붙인다"
source = "한글 맞춤법 제43항"

[[entry]]
pattern = '(두|세|네|다섯|여섯|일곱|여덟|아홉|열)번(?![가-힣])'
fix = "$1 번"
why = "횟수를 세는 번 은 단위 명사라 띄어 쓴다"
source = "한글 맞춤법 제43항"

[[entry]]
pattern = '({ㄹ})것(?=이|을|은|도|과|와|의|인|처럼|만|\s|[.,!?)]|$)'
fix = "$1 것"
why = "것 은 의존 명사라 앞말과 띄어 쓴다. 할 것이다"
source = "한글 맞춤법 제42항"

[[entry]]
pattern = '({ㄹ})줄 (?=알|모르|아는|모르는|압|몰)'
fix = "$1 줄 "
why = "방법이나 셈을 뜻하는 줄 은 의존 명사라 띄어 쓴다. 할 줄 안다"
source = "한글 맞춤법 제42항"

[[entry]]
pattern = '({ㄹ})때(?=[가는도마다에의]?(?![가-힣]))'
fix = "$1 때"
why = "때 는 명사라 관형형 뒤에서 띄어 쓴다. 할 때"
source = "한글 맞춤법 제2항"
