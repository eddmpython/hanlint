# 자주 틀리는 표기. 확정할 수 있는 자리만 둔다. 뜻에 따라 둘 다 맞는 것 (데/대, 이따가/있다가, 못하다/못 하다,
# 한번/한 번, 안되다/안 되다) 은 넣지 않는다. 그런 자리는 사람이 뜻을 보고 정한다.
# pattern 은 정규식이다. {ㄹ} 과 {ㄴ} 은 그 받침으로 끝나는 음절 전체의 문자 부류로 펼쳐진다. fix 의 $1 은 그룹이다.
# 근거는 국립국어원 한글 맞춤법 조항, 온라인가나다 답변 (번호), 표준국어대사전 표제어다. 2026-08-27 에 확인했다.
# 사용자는 설정의 dictionary.spelling 으로 더한다.

[[entry]]
pattern = '됬'
fix = "됐"
why = "되었 의 준말은 됐 이다. ㅚ 뒤에 -어, -었- 이 어울려 ㅙ, ㅙㅆ 으로 줄면 준 대로 적는다"
source = "한글 맞춤법 제35항 붙임 2, 온라인가나다 306230"

[[entry]]
pattern = '돼(고|면|니|다|므로|든|기)(?![가-힣])'
fix = "되$1"
why = "-어 가 붙지 않는 자리는 되- 다. 돼 는 되어 의 준말에만 쓴다"
source = "한글 맞춤법 제35항 붙임 2, 온라인가나다 306432"

[[entry]]
pattern = '(?<![가-힣])되(요|서)(?![가-힣])'
fix = "돼$1"
why = "되어요, 되어서 의 준말이라 돼요, 돼서 다"
source = "한글 맞춤법 제35항 붙임 2, 온라인가나다 306432"

[[entry]]
pattern = '안되(요|서)(?![가-힣])'
fix = "안 돼$1"
why = "부사 안 은 띄어 쓰고 되어 의 준말은 돼 다"
source = "한글 맞춤법 제35항 붙임 2, 상담 사례 5649"

