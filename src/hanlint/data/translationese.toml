# 번역투 사전. pattern 은 정규식, fix 는 맞은 자리를 그대로 바꿀 수 있을 때만 둔다 ($1 은 그룹).
# fix 가 없으면 why 가 고치는 방향을 말한다. 출처는 국립국어원 새국어생활 1990 과 2012, urimal.org 김민지 2020,
# egowriting, kubernetes.io 한국어 현지화 가이드.

[[entry]]
pattern = "에 있어서"
fix = "에서"
why = "번역투다. `분야에 있어서` 는 `분야에서` 다"
source = "urimal.org 김민지 2020"

[[entry]]
pattern = "에 위치해 있"
fix = "에 있"
why = "번역투다. `서울에 위치해 있다` 는 `서울에 있다` 다"
source = "egowriting 번역투 고치기"

[[entry]]
pattern = "에 위치하"
fix = "에 있"
why = "번역투다. `평창에 위치하고 있습니다` 는 `평창에 있습니다` 다"
source = "egowriting 번역투 고치기"

[[entry]]
pattern = "([가-힣])로부터"
fix = "$1에게"
why = "번역투다. `상사로부터 인정받다` 는 `상사에게 인정받다` 다. 출발점이 장소면 `에서` 다"
source = "egowriting 번역투 고치기"

[[entry]]
pattern = "음에도 불구하고"
fix = "지만"
why = "번역투다. `늦었음에도 불구하고` 는 `늦었지만` 이다"
source = "egowriting 번역투 고치기"

[[entry]]
pattern = "에도 불구하고"
why = "번역투다. `지만` 이나 `는데도` 로 푼다"
source = "egowriting 번역투 고치기"

[[entry]]
pattern = "([가-힣])(?:을|를) 통해(?:서)?"
why = "through 의 직역이다. `밤샘 공부를 통해` 는 `밤샘 공부로` 다. 수단이면 `로`, 경로면 `거쳐` 다"
source = "한빛미디어 번역투 TOP 12, im-not-ai A-2"

[[entry]]
pattern = "에 의(?:해|하여|해서)"
why = "by 피동의 직역이다. 한 것을 주어로 세워 능동으로 쓴다. `보육원에 의해 보호되었다` 는 `보육원이 보호했다` 다"
source = "urimal.org 김민지 2020"

[[entry]]
pattern = "(?:으)?로 인(?:해|하여)"
why = "번역투다. `국민투표로 인하여 결정` 은 `국민투표로 결정` 이다. 원인이면 `때문에` 다"
source = "urimal.org 김민지 2020"

[[entry]]
pattern = "에 대(?:해|하여|해서)"
why = "번역투다. `물음에 대해 답하다` 는 `물음에 답하다` 다. 목적어로 되돌린다"
source = "urimal.org 김민지 2020"

[[entry]]
pattern = "에 관(?:해|하여|해서)"
why = "번역투다. 목적어나 `~은` 으로 되돌린다"
source = "urimal.org 김민지 2020"

[[entry]]
pattern = "(?:을|를) 위(?:해|하여|해서)"
why = "번역투다. `여행을 가기 위해` 는 `여행 가려고` 다"
source = "urimal.org 김민지 2020"

[[entry]]
pattern = "(?:을|를) 필요로 하"
why = "번역투다. `사회가 필요로 하는 것` 은 `사회가 필요한 것` 이다"
source = "서울신문 바른 말글 2018"

[[entry]]
pattern = "하는 중(?:이다|입니다|이었다)"
why = "진행형 직역이다. `도착하는 중입니다` 는 `도착합니다` 다"
source = "egowriting 번역투 고치기"

# 서로의, 따로의, 별로의 는 낱말이라 뺀다. 실측: 002 의 `서로의 의견` 이 잡혔다.
[[entry]]
pattern = "(?!서로의|따로의|별로의)[가-힣](?:로의|에의) "
why = "전치사구를 명사화한 번역투다. `풍요로의 길` 은 `풍요에 이르는 길` 이다"
source = "국립국어원 새국어생활 1990"

[[entry]]
pattern = "에 다름 아니"
why = "일본어 직역이다. `바로 ~이다` 로 쓴다"
source = "부산일보 바른말 광 2018"

[[entry]]
pattern = "(?:이|가) 가능(?:하다|합니다|해진다)"
why = "possible 의 직역이다. `스킵이 가능하다` 는 `스킵할 수 있다` 다"
source = "나무위키 번역체 문장"

[[entry]]
pattern = "하게 만들(?:었|었습|었다|다)"
why = "make 사동의 직역이다. `나를 행복하게 만들었다` 는 `난 그 일로 행복했다` 다"
source = "hanmal 번역투 정리 2011"

[[entry]]
pattern = "(?:을|를) 가지고 있"
why = "have 의 직역이다. `목소리를 가지고 있다` 는 `목소리가 좋다`, `책을 가지고 있다` 는 `책이 있다` 다"
source = "김순영 2012 (이근희 2005 재인용)"
