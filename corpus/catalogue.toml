[corpus]
version = 1
root = "../hanlint.out/corpus"
manifest = "corpus/documents.json"
minimumDocuments = 300
types = ["blog", "technicalDocs", "report", "essay", "guide", "encyclopedia", "fiction"]

[[source]]
id = "kubernetesWebsite"
kind = "zipArchive"
title = "Kubernetes 한국어 웹사이트"
owner = "Kubernetes Authors"
home = "https://kubernetes.io/ko/"
source = "https://github.com/kubernetes/website"
revision = "3f13d3c02f5f771f1271dad9c97fc293c99d5bcd"
archive = "https://codeload.github.com/kubernetes/website/zip/3f13d3c02f5f771f1271dad9c97fc293c99d5bcd"
license = "CC-BY-4.0"
licenseUrl = "https://github.com/kubernetes/website/blob/3f13d3c02f5f771f1271dad9c97fc293c99d5bcd/LICENSE"
normalizer = "kubernetes"

[[source.collection]]
type = "blog"
include = "content/ko/blog/**/*.md"
limit = 1000
minimumKoreanChars = 300
preset = "blog"

[[source.collection]]
type = "technicalDocs"
include = "content/ko/docs/**/*.md"
exclude = ["content/ko/docs/tasks/**", "content/ko/docs/tutorials/**"]
limit = 1000
minimumKoreanChars = 500
preset = "docs"

[[source.collection]]
type = "guide"
include = "content/ko/docs/tasks/**/*.md"
alsoInclude = ["content/ko/docs/tutorials/**/*.md"]
limit = 1000
minimumKoreanChars = 500
preset = "guide"

[[source]]
id = "koWikinews"
kind = "mediaWiki"
title = "한국어 위키뉴스 대한민국 기사"
