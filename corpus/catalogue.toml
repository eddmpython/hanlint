[[source.collection]]
type = "technicalDocs"
include = "learn_web_development/**/index.md"
limit = 200
minimumKoreanChars = 500
preset = "docs"

[[source.collection]]
type = "technicalDocs"
include = "web/**/index.md"
limit = 300
minimumKoreanChars = 500
preset = "docs"

[[source.collection]]
type = "technicalDocs"
include = "glossary/**/index.md"
limit = 150
minimumKoreanChars = 300
preset = "docs"
