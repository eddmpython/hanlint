[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hanlint"
# 버전 정본은 src/hanlint/__init__.py 의 __version__ 하나다. hatch 가 거기서 읽는다 (아래 tool.hatch.version).
dynamic = ["version"]
description = "한국어 글 검사기. Korean prose linter for Markdown: translationese, noun piles, double passives, weak structure"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/hanlint/data/evidenceEntailmentV1.LICENSE.md"]
requires-python = ">=3.11"
keywords = ["korean", "korean-language", "hangul", "linter", "prose", "prose-linter", "writing", "readability", "markdown", "style-checker", "proofreading", "text-linter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Natural Language :: Korean",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Text Processing :: Markup :: Markdown",
]
# 런타임 의존성 0. extra 는 개발 도구뿐이다.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# 말뭉치의 지문 표 (Parquet) 를 만들고 묻는 개발 도구. 제품은 읽지 않는다.
corpus = ["polars>=1"]

[project.urls]
Homepage = "https://github.com/eddmpython/hanlint"
Documentation = "https://github.com/eddmpython/hanlint#readme"
Source = "https://github.com/eddmpython/hanlint"
Issues = "https://github.com/eddmpython/hanlint/issues"
Changelog = "https://github.com/eddmpython/hanlint/blob/main/CHANGELOG.md"

[project.scripts]
hanlint = "hanlint.cli.main:main"

[tool.hatch.version]
path = "src/hanlint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hanlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 테스트 파일과 함수는 test 접두 camelCase 다 (operation.codeStyle). 기본 test_*.py 패턴은 snake 다.
python_files = ["test*.py"]
python_functions = ["test*"]
pythonpath = ["src", "."]
# 캐시는 저장소 밖 형제 폴더로. 저장소 안에 임시 산출물을 두지 않는다 (강행규칙).
cache_dir = "../hanlint.out/pytestCache"

[tool.ruff]
# ruff 는 표시 폭으로 센다. 한글은 2칸이라 110 이면 한국어 docstring 이 55자에서 걸린다. 130 은 한글 65자다.
line-length = 130
target-version = "py311"
src = ["src", "tests", "hooks", "scripts"]
cache-dir = "../hanlint.out/ruffCache"

[tool.ruff.lint]
# N (pep8-naming) 은 선택하지 않는다. camelCase 와 충돌한다. 이름은 tests/gates/testNaming.py 가 본다.
select = ["E", "F", "W", "I", "B", "UP"]
